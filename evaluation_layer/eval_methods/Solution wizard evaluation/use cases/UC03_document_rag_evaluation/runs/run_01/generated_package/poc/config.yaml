# PoC configuration for Manufacturing Knowledge Assistant
# Generated by GAIK Solution Configuration Wizard V2, edited by the wizard agent
# to match the actual RAG + RBAC pipeline in run_poc.py.

provider: azure_openai         # azure_openai | openai
use_azure: true

models:
  generation: gpt-5.4          # answer-generation model/deployment
  temperature: 1.0             # user-specified; honored via a direct LLM call
                                # (AnswerGenerator.generate() hardcodes temperature=0.0
                                # internally and has no override, see run_poc.py)
  reasoning_effort: medium      # user-specified; passed to the chat completion call
                                # if the deployment rejects it, run_poc.py retries without it
  # embedding: text-embedding-3-large   # optional override; env var RAG_EMBEDDING_DEPLOYMENT
                                         # takes precedence if set (exact deployment name
                                         # was not specified -- see assumption_002)

language: en

paths:
  sample_input: sample_input/
  output: output/
  schemas: schemas/
