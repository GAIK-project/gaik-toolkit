# PoC configuration for Manufacturing Knowledge Base RAG Assistant
# Generated by GAIK Solution Configuration Wizard V2.

provider: azure_openai         # azure_openai | openai
use_azure: true

models:
  extraction: gpt-5.4          # Azure chat deployment name (overridden by AZURE_CHAT_DEPLOYMENT env var)
  embedding: text-embedding-3-large  # Azure embedding deployment (overridden by AZURE_EMBEDDING_DEPLOYMENT env var)
  temperature: 0.0
  reasoning_effort: medium     # passed to gpt-5.4; ignored silently if not supported by the deployment

language: en

rag:
  top_k: 4                     # number of chunks to retrieve per query
  chunk_size_tokens: 400       # approximate chunk size in tokens (chars / 4)
  chunk_overlap_tokens: 80     # approximate overlap between consecutive chunks

paths:
  sample_input: sample_input/
  output: output/
  schemas: schemas/
  prompts: prompts/
