name: Live smoke

# Real provider calls on a branch, before a tag: the release smoke checks
# (scripts/release_smoke.py) and the component-check runner
# (.claude/skills/component-check). Start it from Actions or with
#   gh workflow run live-smoke.yml --ref main -f providers=azure
# It is not the release gate: publish.yml still runs scripts/release_check.py on the tag.
# A selected provider without its secrets or model variable fails the run.

on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Comma-separated providers: azure, openai, google, vertex, aitta, anthropic, anthropic_foundry'
        required: true
        default: 'azure'
        type: string

permissions: {}

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install package
      run: uv pip install --system ".[all,dev]"

    - name: Release smoke and component check
      env:
        PROVIDERS: ${{ inputs.providers }}
        RUN_DIR: ${{ runner.temp }}/component-check
        RELEASE_AZURE_MODEL: ${{ vars.RELEASE_AZURE_MODEL || 'gpt-6-luna' }}
        RELEASE_OPENAI_MODEL: ${{ vars.RELEASE_OPENAI_MODEL }}
        RELEASE_GOOGLE_MODEL: ${{ vars.RELEASE_GOOGLE_MODEL }}
        RELEASE_VERTEX_MODEL: ${{ vars.RELEASE_VERTEX_MODEL }}
        RELEASE_AITTA_MODEL: ${{ vars.RELEASE_AITTA_MODEL }}
        RELEASE_ANTHROPIC_MODEL: ${{ vars.RELEASE_ANTHROPIC_MODEL }}
        RELEASE_ANTHROPIC_FOUNDRY_MODEL: ${{ vars.RELEASE_ANTHROPIC_FOUNDRY_MODEL }}
        AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        AITTA_API_KEY: ${{ secrets.AITTA_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
        ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
      run: |
        set -uo pipefail
        case "$PROVIDERS" in
          ''|*[!a-z_,]*) echo "::error::providers must be comma-separated provider names"; exit 1;;
        esac
        mkdir -p results
        status=0
        for provider in ${PROVIDERS//,/ }; do
          model_var="RELEASE_${provider^^}_MODEL"
          model="${!model_var:-}"
          if [ -z "$model" ]; then
            echo "::error::Set the repository variable $model_var to a current model of $provider"
            status=1
            continue
          fi
          python scripts/release_smoke.py --provider "$provider" --model "$model" \
            --result "results/release-smoke-$provider.json" || status=1
        done
        python .claude/skills/component-check/run_checks.py \
          --providers "$PROVIDERS" --require-all --out "$RUN_DIR" || status=1
        if [ -f "$RUN_DIR/summary.md" ]; then
          cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    # Synthetic inputs only; the smoke results hold no response bodies, and the
    # component check redacts credentials from every error it records.
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: live-smoke-${{ github.sha }}
        path: |
          results/
          ${{ runner.temp }}/component-check/
        if-no-files-found: warn
        retention-days: 30
