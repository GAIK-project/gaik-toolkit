name: Run Tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'implementation_layer/**'
      - '.claude-plugin/**'
      - '.claude/skills/gaik-sync/**'
      - '.claude/skills/component-check/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/test.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/release_*.py'
      - 'AGENTS.md'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'implementation_layer/**'
      - '.claude-plugin/**'
      - '.claude/skills/gaik-sync/**'
      - '.claude/skills/component-check/**'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - '.github/workflows/test.yml'
      - '.github/workflows/publish.yml'
      - 'scripts/release_*.py'
      - 'AGENTS.md'
  schedule:
    # Nightly, for the live-LLM job only (see `llm-tests` below).
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI / gh CLI
  workflow_call:  # Allow this workflow to be called by other workflows
    inputs:
      ref:
        description: 'Git ref to checkout (for tag-based builds)'
        required: false
        type: string
      release_gate:
        description: 'Require the complete authenticated component release gate'
        required: false
        default: false
        type: boolean
    # The caller passes these by name (publish.yml), so no other secret reaches this
    # workflow. A missing one makes the release gate fail, not pass.
    secrets:
      AZURE_API_KEY:
        required: false
      AZURE_ENDPOINT:
        required: false
      AZURE_API_VERSION:
        required: false
      AZURE_DEPLOYMENT:
        required: false
      OPENAI_API_KEY:
        required: false
      GOOGLE_API_KEY:
        required: false
      GOOGLE_SERVICE_ACCOUNT_JSON:
        required: false
      AITTA_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      ANTHROPIC_FOUNDRY_API_KEY:
        required: false

# Nothing is granted by default; each job asks for what it needs, and no job
# writes to the repository.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # PRs: only Python 3.11 for fast feedback
        # Push to main/dev: full matrix
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.12"]') }}

    # A pgvector database for the live PgVectorStore tests (test_pg_vector_store_sql.py,
    # test_pg_vector_store_health.py); they skip when GAIK_TEST_PG_URL is unset.
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}  # Use input ref if provided, otherwise default
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install package
      run: uv pip install --system ".[all,dev,llm-all,wizard]"

    # The Word export tests (test_report_writer.py, test_report_synthesizer.py) skip without Pandoc.
    - name: Install Pandoc
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pandoc

    - name: Smoke test basic import
      run: python -c "from gaik import __version__; print(f'gaik {__version__} OK')"

    - name: Ruff format check (+ non-blocking lint)
      run: |
        # Pinned ruff version so formatting is deterministic across CI runs.
        uvx ruff@0.14.10 format --check implementation_layer/
        uvx ruff@0.14.10 check implementation_layer/src/gaik/ || echo "::warning::ruff check reported non-blocking style issues (e.g. long prompt strings)"

    # Deterministic tests only. The `llm` marker covers tests that call a real
    # model and assert on its output — those belong in the `llm-tests` job below,
    # because a change in the model or in the Azure deployment must not turn a
    # docs-only commit red.
    - name: Run tests
      env:
        GAIK_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
      run: pytest -m "not llm" --strict-markers

    # The Solution Wizard's tests are outside `testpaths` and share a file name with
    # unit_tests/ (test_source_tracing.py), so they run in a pytest session of their own.
    # ReportLab is what a generated PoC installs for its PDF report (scaffolder.py); no
    # gaik extra brings it, and without it test_pdf_report.py skips as a whole. The wizard
    # extra (claude-agent-sdk) above lets the interactive runner's tool guard and its SDK
    # contract tests run here too.
    - name: Run Solution Wizard tests
      run: |
        uv pip install --system "reportlab>=4.0"
        pytest implementation_layer/solution_wizard/tests -m "not llm" --strict-markers -q

  # The demo app's API tests, in the demo's own environment with this
  # repository's gaik installed editable. Not in the release gate or the
  # nightly run: the deployed demo installs gaik from PyPI.
  demo-api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'schedule' && !inputs.release_gate
    defaults:
      run:
        working-directory: implementation_layer/toolkit_demo_app
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    # `python -m pytest` puts the demo folder on sys.path so `import api` works;
    # plain `pytest` would also pick up the repository root's pytest config.
    - name: Run demo API tests
      run: uv run --python 3.11 --with pytest --with pytest-asyncio python -m pytest api/tests -o addopts="" -q

  # The REST API's tests (implementation_layer/api), with this repository's gaik
  # installed editable and the API's own requirements, on the Python of its image.
  # Not in the release gate or the nightly run, like demo-api-tests.
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'schedule' && !inputs.release_gate
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    # From the repository root, `python -m pytest` puts it on sys.path so
    # `import implementation_layer.api` works; `-o addopts=""` drops the library's options.
    - name: Run API tests
      run: >-
        uv run --no-project --python 3.12 --with-editable .
        --with-requirements implementation_layer/api/requirements.txt --with pytest --with httpx
        python -m pytest implementation_layer/api/tests -o addopts="" -q

  # The demo front end's unit tests, type check and lint. Lint warnings do not
  # fail the job; lint errors do. Not in the release gate or the nightly run.
  demo-frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name != 'schedule' && !inputs.release_gate
    defaults:
      run:
        working-directory: implementation_layer/toolkit_demo_app
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false

    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Unit tests
      run: bun test

    - name: Type check
      run: bunx tsc --noEmit

    - name: Lint
      run: bun run lint

  # Tests that make real LLM calls. Kept off the ordinary push path: they
  # are a signal about the model and the AZURE_DEPLOYMENT behind it, not a
  # regression gate for our code. Run nightly and on demand
  # (`gh workflow run test.yml`), so a failure here points at the deployment.
  llm-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install package
      run: uv pip install --system ".[all,dev]"

    # The live tests skip without credentials, so that a clone without keys can
    # run the suite. In this job a missing secret must fail, not skip the tests.
    - name: Check the Azure secrets are set
      env:
        AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      run: |
        for name in AZURE_API_KEY AZURE_ENDPOINT; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is not set, so the live tests would be skipped."
            exit 1
          fi
        done

    - name: Run live LLM tests
      env:
        AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        AZURE_DEPLOYMENT: ${{ secrets.AZURE_DEPLOYMENT }}
      run: pytest -m llm --strict-markers

  # A tag is not publishable on the strength of offline tests alone. This job
  # runs the same complete command maintainers run before tagging, on the exact
  # release commit. Missing selected credentials or failed/empty live results fail.
  release-validation:
    if: inputs.release_gate == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    timeout-minutes: 60
    steps:
    - name: Checkout release commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.ref }}
        persist-credentials: false
        fetch-depth: 0

    - name: Set up Python 3.11
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    # The chunked transcription check exports its chunks with pydub, which needs ffmpeg.
    - name: Install ffmpeg
      run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

    - name: Require tag and run complete release certification
      env:
        RELEASE_REF: ${{ github.ref }}
        RELEASE_VERSION: ${{ github.ref_name }}
        RELEASE_PROVIDERS: ${{ vars.RELEASE_PROVIDERS || 'azure' }}
        RELEASE_AZURE_MODEL: ${{ vars.RELEASE_AZURE_MODEL || 'gpt-6-luna' }}
        RELEASE_AZURE_BACKENDS: ${{ vars.RELEASE_AZURE_BACKENDS || 'native' }}
        RELEASE_OPENAI_BACKENDS: ${{ vars.RELEASE_OPENAI_BACKENDS || 'native' }}
        RELEASE_GOOGLE_BACKENDS: ${{ vars.RELEASE_GOOGLE_BACKENDS || 'native' }}
        RELEASE_VERTEX_BACKENDS: ${{ vars.RELEASE_VERTEX_BACKENDS || 'native' }}
        RELEASE_AITTA_BACKENDS: ${{ vars.RELEASE_AITTA_BACKENDS || 'native' }}
        RELEASE_ANTHROPIC_BACKENDS: ${{ vars.RELEASE_ANTHROPIC_BACKENDS || 'native' }}
        RELEASE_OPENAI_MODEL: ${{ vars.RELEASE_OPENAI_MODEL }}
        RELEASE_GOOGLE_MODEL: ${{ vars.RELEASE_GOOGLE_MODEL }}
        RELEASE_VERTEX_MODEL: ${{ vars.RELEASE_VERTEX_MODEL }}
        RELEASE_AITTA_MODEL: ${{ vars.RELEASE_AITTA_MODEL }}
        RELEASE_ANTHROPIC_MODEL: ${{ vars.RELEASE_ANTHROPIC_MODEL }}
        RELEASE_ANTHROPIC_FOUNDRY_MODEL: ${{ vars.RELEASE_ANTHROPIC_FOUNDRY_MODEL }}
        RELEASE_AZURE_EMBEDDING_MODEL: ${{ vars.RELEASE_AZURE_EMBEDDING_MODEL }}
        RELEASE_OPENAI_EMBEDDING_MODEL: ${{ vars.RELEASE_OPENAI_EMBEDDING_MODEL }}
        RELEASE_GOOGLE_EMBEDDING_MODEL: ${{ vars.RELEASE_GOOGLE_EMBEDDING_MODEL }}
        RELEASE_VERTEX_EMBEDDING_MODEL: ${{ vars.RELEASE_VERTEX_EMBEDDING_MODEL }}
        RELEASE_AITTA_EMBEDDING_MODEL: ${{ vars.RELEASE_AITTA_EMBEDDING_MODEL }}
        RELEASE_AZURE_TRANSCRIPTION_MODEL: ${{ vars.RELEASE_AZURE_TRANSCRIPTION_MODEL || 'gpt-4o-transcribe' }}
        RELEASE_OPENAI_TRANSCRIPTION_MODEL: ${{ vars.RELEASE_OPENAI_TRANSCRIPTION_MODEL }}
        AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        GOOGLE_PROJECT_ID: ${{ vars.GOOGLE_PROJECT_ID }}
        GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
        GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        AITTA_API_KEY: ${{ secrets.AITTA_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        ANTHROPIC_FOUNDRY_API_KEY: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
        ANTHROPIC_FOUNDRY_RESOURCE: ${{ vars.ANTHROPIC_FOUNDRY_RESOURCE }}
      run: |
        case "$RELEASE_REF" in refs/tags/v*) ;; *) echo 'Release certification requires a version tag'; exit 1;; esac
        uv run python scripts/release_check.py --live --require-provider azure --version "${RELEASE_VERSION#v}"

    # The tag must also pass the component check (.claude/skills/component-check): the
    # schema generator, extractor, vision extractor, RAG, tabular agent and vision parser
    # on synthetic invoices, on Azure.
    # --public keeps provider error text out of the published summary.
    - name: Component check on Azure
      timeout-minutes: 20
      env:
        RUN_DIR: ${{ runner.temp }}/component-check
        RELEASE_AZURE_MODEL: ${{ vars.RELEASE_AZURE_MODEL || 'gpt-6-luna' }}
        AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
        AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
        AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
      run: |
        set -uo pipefail
        status=0
        uv run python .claude/skills/component-check/run_checks.py \
          --providers azure --require-all --public --provider-timeout 600 --attempts 2 \
          --out "$RUN_DIR" || status=1
        if [ -f "$RUN_DIR/summary.md" ]; then
          cat "$RUN_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"

    - name: Upload sanitized certification report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-certification-${{ github.sha }}
        path: |
          results/release-check.json
          ${{ runner.temp }}/component-check/
        if-no-files-found: error
        retention-days: 90
