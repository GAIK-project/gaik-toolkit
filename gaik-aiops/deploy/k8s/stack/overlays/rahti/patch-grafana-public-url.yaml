# Grafana builds its links and redirects from its public address, and sends its cookie over HTTPS only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  template:
    spec:
      containers:
        - name: grafana
          env:
            - {name: GF_SERVER_ROOT_URL, value: "https://grafana-gaik-aiops.2.rahtiapp.fi/"}
            - {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
