# Basic auth in front of MLflow, which has no sign-in of its own. The Route reaches this proxy only;
# the collector keeps writing to the mlflow Service inside the project. Users and password hashes come
# from the aiops-mlflow-auth Secret (create-secrets.sh). OIDC replaces this when WP4's sign-in is ready.
# nginx checks the hash on every request; create-secrets.sh uses bcrypt's lowest cost, which is enough
# for a long random password and keeps the check cheap.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    # Writable under any UID.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 50m;

    server {
        listen 8080;

        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            auth_basic "GAIK MLflow";
            auth_basic_user_file /etc/nginx-auth/htpasswd;
            proxy_pass http://mlflow:5000;
            # MLflow checks the Host header and the Origin against --allowed-hosts and
            # --cors-allowed-origins (patch-mlflow-public-host.yaml), so the public host is passed on.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # The reviewer's password stops here.
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
        }
    }
}
