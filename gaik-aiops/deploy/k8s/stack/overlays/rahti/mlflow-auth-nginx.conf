# Between the sign-in (mlflow-signin.yaml, oauth2-proxy and the GAIK Keycloak) and MLflow, which has no
# sign-in of its own. The Route reaches the sign-in only; this proxy keeps deleting closed and strips the
# sign-in's headers. The collector keeps writing to the mlflow Service inside the project.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    # Writable under any UID.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 50m;

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Signed-in reviewers cannot delete. MLflow's delete endpoints (experiments, runs, traces, models,
        # tags) end in /delete or /delete-<what> under /api/ and /ajax-api/ (2.0 and 3.0), and some use
        # the DELETE method. A deleted experiment would stop the collector storing traces until it
        # restarts (README.md), so deleting is left to a project member through oc port-forward.
        # nginx matches the decoded, slash-merged URI, so an encoded or doubled path matches too.
        location ~ ^/(ajax-)?api/[0-9.]+/mlflow/.*/delete[^/]*$ {
            return 403;
        }

        location / {
            if ($request_method = DELETE) {
                return 403;
            }
            proxy_pass http://mlflow:5000;
            # MLflow checks the Host header and the Origin against --allowed-hosts and
            # --cors-allowed-origins (patch-mlflow-public-host.yaml), so the public host is passed on.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            # The sign-in's token and headers stop here.
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-Access-Token "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Forwarded-Email "";
            proxy_set_header X-Forwarded-Groups "";
            proxy_set_header X-Forwarded-Preferred-Username "";
            # MLflow uses no cookies; the sign-in's session cookie stays with the sign-in.
            proxy_set_header Cookie "";
            proxy_read_timeout 300s;
        }
    }
}
