# The base denies all ingress from outside the project. The OpenShift router, which serves the Routes,
# may reach the two sign-in points and nothing else: Grafana, and the proxy in front of MLflow. MLflow,
# Postgres, Prometheus and the collector stay unreachable from outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-to-grafana
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: grafana}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {policy-group.network.openshift.io/ingress: ""}
      ports: [{protocol: TCP, port: 3000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-router-to-mlflow-signin
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: mlflow-signin}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {policy-group.network.openshift.io/ingress: ""}
      ports: [{protocol: TCP, port: 4180}]
