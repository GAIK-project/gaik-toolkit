[project]
name = "toolkit-demo-app"
version = "0.1.0"
description = "GAIK Toolkit Demo Application"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "python-multipart>=0.0.21",
    "python-dotenv>=1.2.1",
    "fpdf2>=2.8.5",
    "openpyxl>=3.1.0",            # Excel/CSV parsing for the luvata-order demo
    "boto3>=1.35.0",              # S3 presigned URLs for the video-search demo
    "yt-dlp>=2024.0.0",           # video download in api/scripts/seed_dental_demo.py
    "gaik[all-cpu,multimodal-parser,postgres-agent,multi-source-report-generator-agentic,multi-source-report-generator-docx]>=0.5.14",
    # Solution Configuration Wizard (drives the wizard skill via Claude Agent SDK).
    # NOTE: claude-agent-sdk spawns the `claude` Code CLI binary, which must be
    # present in the runtime (installed in local dev; add to the Docker image for prod).
    "claude-agent-sdk>=0.1.48",
]

[tool.uv.sources]
gaik = { path = "../..", editable = true }
