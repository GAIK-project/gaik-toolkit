apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaik-demo
  labels:
    app: gaik-demo
    app.kubernetes.io/part-of: gaik-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaik-demo
  template:
    metadata:
      labels:
        app: gaik-demo
    spec:
      containers:
        - name: gaik-demo
          image: image-registry.apps.2.rahti.csc.fi/gaik/gaik-demo:latest
          ports:
            - containerPort: 3000
          env:
            # Runtime server-side variables only
            # NEXT_PUBLIC_* vars are baked in at build time from .env.production
            - name: REPORT_WRITER_MAX_UPLOAD_MB
              value: "100"
            - name: BACKEND_URL
              value: "http://gaik-demo-api:8000"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-admin
                  key: ADMIN_PASSWORD
            # Still read by the old wizard gate on /api/wizard in proxy.ts until
            # that gate is removed. The /solution-wizard page itself is open and
            # links to WIZARD_V2_URL (set with `oc set env`, read at run time).
            - name: WIZARD_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-admin
                  key: WIZARD_ACCESS_SECRET
                  optional: true
            - name: SUPABASE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-supabase
                  key: SUPABASE_SECRET_KEY
            - name: UPSTASH_REDIS_REST_URL
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-redis
                  key: UPSTASH_REDIS_REST_URL
                  optional: true
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-redis
                  key: UPSTASH_REDIS_REST_TOKEN
                  optional: true
          # proxy.ts buffers each upload body in memory before forwarding it
          # (streaming truncates data in Bun/standalone). Report Writer allows
          # 100 MiB of files; parsing and forwarding can retain multiple copies.
          # Keep headroom above the Next.js baseline and monitor peak usage.
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # Probes tolerate transient backend slowness (Next.js /api/health
          # hits the API pod). Kept loose enough that a hanging upstream
          # call does not kill the frontend before Kubernetes can recover.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
