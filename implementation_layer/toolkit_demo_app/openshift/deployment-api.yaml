apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaik-demo-api
  labels:
    app: gaik-demo-api
    app.kubernetes.io/part-of: gaik-toolkit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaik-demo-api
  template:
    metadata:
      labels:
        app: gaik-demo-api
    spec:
      containers:
        - name: gaik-demo-api
          image: image-registry.apps.2.rahti.csc.fi/gaik/gaik-demo-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: AZURE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-api-keys
                  key: AZURE_API_KEY
                  optional: true
            - name: AZURE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-api-keys
                  key: AZURE_ENDPOINT
                  optional: true
            - name: AZURE_API_VERSION
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-api-keys
                  key: AZURE_API_VERSION
                  optional: true
            - name: DOCLING_API_BASE
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-api-keys
                  key: DOCLING_API_BASE
                  optional: true
            - name: DOCLING_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gaik-demo-api-keys
                  key: DOCLING_API_PASSWORD
                  optional: true
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 8Gi
          # Probes sized for slow multimodal-parser calls that may block the
          # event loop briefly; failureThreshold 5 + timeout 10s tolerates
          # ~150s before kill instead of the ~3s default that triggered a
          # SIGKILL mid-request. See docs/README for tuning rationale.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
