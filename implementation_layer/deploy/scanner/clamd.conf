# clamd for the Solution Wizard's upload check. The api streams each file over
# INSTREAM; nothing is read from disk but the signatures.
Foreground yes
LogTime yes
LogClean no
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
MaxThreads 10
ReadTimeout 120
CommandReadTimeout 30
SelfCheck 3600
ConcurrentDatabaseReload yes

# Above the api's 50 MB upload limit, and room for what an office file or an
# archive unpacks to (the api bounds that at 200 MB itself).
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 400M
MaxRecursion 16
MaxFiles 10000

# A file the scanner cannot fully look into is reported, not passed: the api
# refuses it.
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
AlertBrokenExecutables yes
AlertBrokenMedia yes
HeuristicAlerts yes
HeuristicScanPrecedence yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanArchive yes
ScanXMLDOCS yes
ScanHWP3 yes
PhishingSignatures yes
