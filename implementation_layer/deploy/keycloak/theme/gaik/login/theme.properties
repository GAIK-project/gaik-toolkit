# GAIK sign-in pages: Keycloak's own theme (keycloak.v2) with the Solution
# Wizard's look on top (css/gaik.css). Layout and behaviour stay Keycloak's, so a
# Keycloak update does not break the pages.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/gaik.css
# The wizard's sign-in is light only.
darkMode=false
